name: Update README

# Refreshes the contribution heatmap and regenerates README.md + assets/ from .readme-source/build.py.
# NOTE: README.md is generated. Edit .readme-source/build.py instead — hand edits are overwritten here.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC (~01:17 US Eastern)
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    paths:
      - ".readme-source/**"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install fonttools uharfbuzz numpy

      - name: Refresh the contribution snapshot
        run: python .readme-source/refresh_activity.py "${{ github.repository_owner }}"

      - name: Regenerate README and assets
        run: python .readme-source/build.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update contribution heatmap"
          git push
